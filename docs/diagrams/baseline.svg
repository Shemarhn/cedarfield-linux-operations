<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Cedarfield Baseline topology</title><desc id="desc">Owned client and server network namespaces inside local Ubuntu WSL2. Only an isolated veth link connects them. No external route.</desc><rect width="1200" height="670" fill="#f6f8f5"/><g font-family="Segoe UI,Arial,sans-serif" fill="#16323c"><text x="50" y="65" font-size="36" font-weight="600">Cedarfield: Baseline topology</text><text x="50" y="105" font-size="19">Executed local Ubuntu 24.04 / WSL2 lab. Synthetic data only.</text><rect x="40" y="150" width="1120" height="465" fill="white" stroke="#c9d6d7" stroke-width="2"/><text x="65" y="185" font-size="19">Dedicated lab distribution boundary</text><rect x="75" y="240" width="305" height="240" fill="#e8eeeb" stroke="#086d70" stroke-width="2"/><text x="100" y="280" font-size="25" font-weight="600">Owned client namespace</text><text x="100" y="323" font-size="19">192.0.2.2</text><text x="100" y="365" font-size="18">Key access and scoped scan</text><text x="100" y="410" font-size="18">SSH tunnel to app loopback</text><path d="M380 350 H525" stroke="#086d70" stroke-width="3"/><path d="M525 350 l-12 -8 v16 z" fill="#086d70"/><text x="393" y="315" font-size="17">Isolated veth</text><rect x="530" y="215" width="595" height="350" fill="#f6f8f5" stroke="#086d70" stroke-width="2"/><text x="555" y="255" font-size="25" font-weight="600">Server namespace: 192.0.2.1</text><text x="555" y="300" font-size="20">SSH: permissive effective policy</text><text x="555" y="345" font-size="20">App: root, minimal sandbox</text><text x="555" y="390" font-size="20">Runtime config: root 0644</text><text x="555" y="435" font-size="20">Extra HTTP service: TCP 9099</text><text x="555" y="480" font-size="20">Inactive firewall and update timers</text><text x="65" y="650" font-size="18">No default route, external bridge or NAT. Application TCP 8090 is loopback-only.</text></g></svg>